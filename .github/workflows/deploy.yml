    #     echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ec2_key.pem
    #     chmod 400 ec2_key.pem
    #     ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_BE_HOST }} << 'EOF'
