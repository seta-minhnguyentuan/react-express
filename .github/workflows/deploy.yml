name: Deploy FE & BE to Dev or Prod

on:
  push:
    branches:
      - dev
  create:
    tags:

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy FE to Dev
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/react-express/frontend
            git pull origin dev
            npm install
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo systemctl restart nginx

      - name: Deploy BE to Dev via FE Proxy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            chmod 400 "ap-ec2.pem"

            ssh -i "ap-ec2.pem" ubuntu@${{ secrets.EC2_BE_PRIVATE_IP }} << 'EOF'
              cd /home/ubuntu/react-express/backend
              git pull origin dev
              npm install
              npm run build
              node server.js
            EOF


  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy FE to Prod
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/fe-prod/
            git fetch --tags
            git checkout `git describe --tags $(git rev-list --tags --max-count=1)`
            npm install
            npm run build
            pm2 restart fe-prod || pm2 start npm --name fe-prod -- start

      - name: Deploy BE to Prod
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_BE_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/be-prod/
            git fetch --tags
            git checkout `git describe --tags $(git rev-list --tags --max-count=1)`
            npm install
            npm run build
            pm2 restart be-prod || pm2 start npm --name be-prod -- start
