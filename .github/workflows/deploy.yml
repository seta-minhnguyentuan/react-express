name: Deploy FE & BE to Dev or Prod

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy FE to Dev
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/react-express/frontend
            git pull origin dev
            npm install
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo systemctl reload nginx

      - name: Deploy BE to Dev via FE Proxy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_DEV_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            chmod 400 "ap-ec2.pem"

            ssh -i "ap-ec2.pem" ubuntu@${{ secrets.EC2_BE_PRIVATE_IP }} << 'EOF'
              cd /home/ubuntu/react-express/backend
              git pull origin dev
              npm install
              
              # Kill existing processes
              pkill -f "node server.js" || true
              pkill -f "npm start" || true
              fuser -k 8080/tcp || true
              
              # Wait for processes to die
              sleep 2
              
              # Start in background and detach from terminal
              nohup npm start > server.log 2>&1 &
              
              # Wait a moment and verify it started
              sleep 3
              if pgrep -f "node server.js" > /dev/null; then
                echo "Server started successfully"
                exit 0
              else
                echo "Failed to start server"
                exit 1
              fi
            EOF

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Deploy FE to Prod
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/react-express/frontend
            git fetch --tags origin
            git checkout ${{ steps.tag.outputs.tag }}
            npm install
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html
            sudo systemctl reload nginx

      - name: Deploy BE to Prod via FE Proxy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_FE_PROD_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            chmod 400 "ap-ec2.pem"  # Assuming different key for prod

            ssh -i "ap-ec2.pem" ubuntu@${{ secrets.EC2_BE_PROD_PRIVATE_IP }} << 'EOF'
              cd /home/ubuntu/react-express/backend
              git fetch --tags origin
              git checkout ${{ steps.tag.outputs.tag }}
              npm install
              
              # Kill existing processes
              pkill -f "node server.js" || true
              pkill -f "npm start" || true
              fuser -k 8080/tcp || true
              
              # Wait for processes to die
              sleep 2
              
              # Start in background and detach from terminal
              nohup npm start > server.log 2>&1 &
              
              # Wait a moment and verify it started
              sleep 3
              if pgrep -f "node server.js" > /dev/null; then
                echo "Production server started successfully"
                exit 0
              else
                echo "Failed to start production server"
                exit 1
              fi
            EOF

  notify-deployment:
    needs: [deploy-dev, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Deployment Status
        run: |
          if [[ "${{ needs.deploy-dev.result }}" == "success" ]]; then
            echo "✅ Dev deployment successful"
          elif [[ "${{ needs.deploy-dev.result }}" == "failure" ]]; then
            echo "❌ Dev deployment failed"
          fi
          
          if [[ "${{ needs.deploy-prod.result }}" == "success" ]]; then
            echo "✅ Prod deployment successful"
          elif [[ "${{ needs.deploy-prod.result }}" == "failure" ]]; then
            echo "❌ Prod deployment failed"
          fi