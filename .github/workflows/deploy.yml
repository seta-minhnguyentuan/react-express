name: CI/CD Deploy to EC2 via ECR

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_FE_REPO: 468674691378.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/fullstack-app
  ECR_BE_REPO: 468674691378.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/fullstack-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # ===== BACKEND =====
    - name: Log in to ECR (BE)
      run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_BE_REPO

    - name: Build and push BE Docker image
      run: |
        docker build -t backend ./backend
        docker tag backend:latest $ECR_BE_REPO:backend-latest
        docker push $ECR_BE_REPO:backend-latest

    - name: Setup SSH key
      run: |
        echo "${{ secrets.EC2_KEY }}" > key.pem
        chmod 400 key.pem

    - name: Deploy to EC2 (BE)
      run: |
        # Copy the key to the bastion host (FE EC2) for accessing BE EC2
        scp -o StrictHostKeyChecking=no -i key.pem key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_FE_HOST }}:~/be_key.pem
        
        # SSH to FE EC2 (bastion) and then SSH to BE EC2 to deploy
        ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_FE_HOST }} << 'EOF'
          chmod 400 ~/be_key.pem
          ssh -o StrictHostKeyChecking=no -i ~/be_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_BE_HOST }} << 'INNER_EOF'
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_BE_REPO }}
            docker pull ${{ env.ECR_BE_REPO }}:backend-latest
            docker stop backend || true && docker rm backend || true
            docker run -d --name backend -p 8080:8080 ${{ env.ECR_BE_REPO }}:backend-latest
        INNER_EOF
          rm ~/be_key.pem
        EOF

    # ===== FRONTEND =====
    - name: Log in to ECR (FE)
      run: aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_FE_REPO

    - name: Build and push FE Docker image
      run: |
        docker build -t frontend ./frontend
        docker tag frontend:latest $ECR_FE_REPO:frontend-latest
        docker push $ECR_FE_REPO:frontend-latest

    - name: Deploy to EC2 (FE)
      run: |
        ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_FE_HOST }} << 'EOF'
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_FE_REPO }}
          echo "Pulling frontend image..."
          docker pull ${{ env.ECR_FE_REPO }}:frontend-latest
          
          echo "Stopping existing container..."
          docker stop fe_app || true && docker rm fe_app || true
          
          echo "Starting new frontend container..."
          docker run -d --name fe_app -p 80:80 \
            -e BACKEND_HOST=${{ secrets.EC2_BE_HOST }} \
            -e BACKEND_PORT=8080 \
            ${{ env.ECR_FE_REPO }}:frontend-latest
          
          echo "Frontend deployment completed successfully"
        EOF
